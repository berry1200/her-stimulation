<!doctype html>
<!--
  Motion design starter — every frame is a pure function of time.

  Render contract (render.mjs relies on it):
    - window.seek(t) paints the exact frame for time t (seconds). Nothing else animates.
    - No CSS transitions/animations, setTimeout, setInterval or requestAnimationFrame.
    - No state carried between frames: seek(5) must look the same whether called after seek(4) or seek(11).
    - Randomness only through the seeded helpers below (never Math.random).
    - window.DURATION = total seconds. window.ready (optional Promise) resolves when fonts/images are loaded.

  Preview in a browser: open this file, append ?t=2.5 to view a frame, ?play=1 to scrub in real time,
  ?guides=1 to show the vertical-video safe zone.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<script>
/* ============================== BRAND + CONTENT ============================== */
// Swap these for the brand brief. Keep content in one place so scenes stay reusable.
const BRAND = {
  bg: '#0E0E12', fg: '#F5F3EE', muted: '#8A8780', accent: '#F2C14E', accent2: '#E4572E',
  display: '800 1px "Inter", "Liberation Sans", "DejaVu Sans", sans-serif',
  body: '500 1px "Inter", "Liberation Sans", "DejaVu Sans", sans-serif',
};
const CONTENT = {
  hook: ['Stop', 'scrolling.'],
  lines: ['One idea.', 'One shape.', 'Zero cuts.'],
  stat: 14, statPrefix: '$', statLabel: 'what one loaf really costs',
  cta: 'Follow for part 2',
};
window.DURATION = 12;

/* ============================== CANVAS SETUP ============================== */
const R = window.RENDER || {};
const W = R.width || 1080, H = R.height || 1920;
const canvas = document.getElementById('film');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
const U = W / 1080;               // design unit: write sizes for 1080-wide, they scale with the canvas

/* ============================== HELPERS ============================== */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const mix = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
// progress of t through [start, start + dur], clamped 0..1
const prog = (t, start, dur) => clamp((t - start) / dur);
const ease = {
  linear: p => p,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  outExpo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  inExpo: p => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
  outBack: p => 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2),
  inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
};
// Closed-form damped spring from 0 → 1. No simulation state, so it is safe for seek(t).
// freq: oscillations/sec feel (higher = snappier), damping: 0..1 (lower = bouncier)
function spring(t, { freq = 2.2, damping = 0.55 } = {}) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * freq, z = damping, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
// Seeded randomness (mulberry32) and smooth 1D value noise — deterministic per seed.
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = n => rng(n * 9973 + 17)();
function noise1(x, seed = 1) {
  const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 1013), hash(i + 1 + seed * 1013), s) * 2 - 1;
}
// Beat helpers: render.mjs injects window.BEATS (seconds) from beats.json when --beats is passed.
const BEATS = window.BEATS || [];
function lastBeat(t) { let b = null; for (const x of BEATS) { if (x <= t) b = x; else break; } return b; }
function beatPulse(t, decay = 8) { const b = lastBeat(t); return b === null ? 0 : Math.exp(-(t - b) * decay); }

function font(spec, size) { return spec.replace('1px', `${Math.round(size * U)}px`); }
// maxWidth (design px) shrinks the type until it fits, so long words never run out of the safe zone.
function text(str, x, y, { spec = BRAND.display, size = 120, color = BRAND.fg, align = 'left',
                          baseline = 'alphabetic', tracking = 0, alpha = 1, maxWidth = 870 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = font(spec, size);
  ctx.letterSpacing = `${tracking * size * U}px`;
  const measured = ctx.measureText(str).width / U;
  if (measured > maxWidth) {
    size *= maxWidth / measured;
    ctx.font = font(spec, size);
  }
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = baseline;
  ctx.letterSpacing = `${tracking * size * U}px`;
  ctx.fillText(str, x * U, y * U);
  ctx.restore();
}
// Reveal text through a moving mask (a wipe), instead of fading it in.
function maskReveal(p, x, y, w, h, draw) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x * U, y * U, w * U * clamp(p), h * U); ctx.clip();
  draw(); ctx.restore();
}
function grain(t, amount = 0.035) {
  const r = rng(Math.floor(t * 24) + 7);  // grain changes 24×/s, still deterministic
  ctx.save(); ctx.globalAlpha = amount;
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = r() > 0.5 ? '#fff' : '#000';
    ctx.fillRect(r() * W, r() * H, 2 * U, 2 * U);
  }
  ctx.restore();
}
function guides() {
  ctx.save(); ctx.strokeStyle = 'rgba(255,0,80,.8)'; ctx.lineWidth = 3;
  ctx.strokeRect(60 * U, 250 * U, (1080 - 60 - 150) * U, (1470 - 250) * U);   // universal safe zone
  ctx.restore();
}

/* ============================== SCENES ============================== */
// Each scene gets draw(t, T): t = seconds since the scene started, T = global time (use T for beats).
// Keep one idea per scene; something new every 2–4s.
const scenes = [
  { start: 0, end: 2.6, draw(t) {             // HOOK: kinetic type slams in on a spring, no fade
      const a = spring(t, { freq: 2.4, damping: 0.5 });
      const b = spring(t - 0.18, { freq: 2.4, damping: 0.5 });
      text(CONTENT.hook[0], lerp(-700, 90, a), 760, { size: 230, tracking: -0.04 });
      text(CONTENT.hook[1], lerp(1180, 90, b), 980, { size: 230, tracking: -0.04, color: BRAND.accent });
      const bar = ease.outExpo(prog(t, 0.5, 0.6));
      ctx.fillStyle = BRAND.accent2; ctx.fillRect(90 * U, 1040 * U, 600 * bar * U, 18 * U);
  } },
  { start: 2.6, end: 6.6, draw(t) {           // ONE SHAPE: a single element morphs, lines stagger in
      const m = spring(t, { freq: 1.6, damping: 0.62 });
      const w = lerp(160, 900, m), h = lerp(160, 620, m), r = lerp(80, 36, m);
      const y = 380 + 40 * noise1(t * 0.8, 3);
      ctx.fillStyle = BRAND.accent;
      ctx.beginPath(); ctx.roundRect((540 - w / 2) * U, y * U, w * U, h * U, r * U); ctx.fill();
      CONTENT.lines.forEach((line, i) => {
        const p = ease.outCubic(prog(t, 0.6 + i * 0.45, 0.5));
        maskReveal(p, 150, 440 + i * 170, 800, 160, () =>
          text(line, 150, 560 + i * 170, { size: 120, color: BRAND.bg, tracking: -0.02 }));
      });
  } },
  { start: 6.6, end: 9.8, draw(t, T) {        // DATA: counter + bar on a spring, pulse on beats
      const c = ease.outExpo(prog(t, 0.1, 1.4));
      const pulse = 1 + 0.06 * beatPulse(T);
      ctx.save(); ctx.translate(540 * U, 900 * U); ctx.scale(pulse, pulse);
      text(`${CONTENT.statPrefix}${Math.round(CONTENT.stat * c)}`, 0, 0, { size: 420, align: 'center', tracking: -0.05 });
      ctx.restore();
      text(CONTENT.statLabel, 540, 1040, { spec: BRAND.body, size: 64, align: 'center', color: BRAND.muted });
      const bw = spring(t - 0.3, { freq: 1.8, damping: 0.6 });
      ctx.fillStyle = BRAND.accent; ctx.fillRect(160 * U, 1120 * U, 760 * bw * U, 24 * U);
  } },
  { start: 9.8, end: 12, draw(t) {            // CTA: card rises on a spring and settles
      const p = spring(t, { freq: 1.9, damping: 0.58 });
      ctx.fillStyle = BRAND.fg;
      ctx.beginPath(); ctx.roundRect(90 * U, lerp(1920, 820, p) * U, 900 * U, 300 * U, 40 * U); ctx.fill();
      text(CONTENT.cta, 540, lerp(1920, 820, p) + 180, { size: 92, align: 'center', color: BRAND.bg });
  } },
];

/* ============================== SEEK ============================== */
window.seek = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = BRAND.bg; ctx.fillRect(0, 0, W, H);
  const last = scenes[scenes.length - 1];
  for (const s of scenes) if (t >= s.start && t < s.end) s.draw(t - s.start, t);
  if (t >= last.end) last.draw(last.end - last.start, t);
  grain(t);
  if (R.guides || /guides=1/.test(location.search)) guides();
};

window.ready = document.fonts.ready;

/* ============================== PREVIEW (ignored by render.mjs) ============================== */
if (!window.RENDER) {
  const q = new URLSearchParams(location.search);
  window.ready.then(() => {
    if (q.get('play')) {
      const t0 = performance.now();
      const loop = () => { window.seek(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); };
      loop();
    } else {
      window.seek(parseFloat(q.get('t') || '0'));
    }
  });
}
</script>
</body>
</html>
