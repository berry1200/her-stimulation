<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Director Studio</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script>try { if (localStorage.getItem("director-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
    <script src="/vendor/hyperframes-player.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Director</a>
      <div id="project-title" class="project-title"></div>
      <div class="topbar-actions" id="topbar-actions"></div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to dark mode">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="app"></main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
